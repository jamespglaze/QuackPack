// ============================================================================
// QuackPack radiation fields for Kerbalism
//
// Geometry values are in body radii measured from the body centre.
// Radiation values are in rad/hour.
//
// Design basis:
// - Blas: weak/moderate dynamo; metal-poor super-Kerbin.
// - Jot: strong giant-planet dynamo, compressed by stellar wind.
// - Cind: metal-rich, rapidly rotating synchronous world; strong intrinsic
//         dynamo, but heavily compressed by the stellar wind.
// - Geet/Subon: no independent global field; they inherit parent-chain fields.
// ============================================================================


// ============================================================================
// BLAS
// Radius: 811 km
// Rotation: ~17.13 h
// Nominal field assumption: ~0.15 G equatorial
// Dayside magnetopause: ~4.24 Rp
// pause_radius / pause_compression = 6.15 / 1.45 = ~4.24 Rp
// Geet orbits at ~3.62 Blas radii, normally inside the magnetopause.
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Blas

    has_inner = true
    inner_dist = 1.65
    inner_radius = 0.45
    inner_compression = 1.10
    inner_extension = 0.80
    inner_deform_xy = 1
    inner_quality = 30

    has_outer = true
    outer_dist = 2.00
    outer_radius = 2.30
    outer_border_dist = 1.00
    outer_border_radius = 1.10
    outer_compression = 1.10
    outer_extension = 0.85
    outer_deform = 0.05
    outer_quality = 30

    has_pause = true
    pause_radius = 6.15
    pause_compression = 1.45
    pause_extension = 0.20
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// JOT
// Radius: 8,339 km
// Rotation: ~21.46 h
// Nominal field assumption: ~2 G equatorial
// Dayside magnetopause: ~8.89 Rp
// pause_radius / pause_compression = 12.00 / 1.35 = ~8.89 Rp
// Subon orbits at ~1.67 Jot radii, deep inside the inner radiation belt.
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Jot

    has_inner = true
    inner_dist = 1.80
    inner_radius = 0.55
    inner_compression = 1.08
    inner_extension = 0.80
    inner_deform_xy = 1
    inner_quality = 30

    has_outer = true
    outer_dist = 2.50
    outer_radius = 2.50
    outer_compression = 1.15
    outer_extension = 0.85
    outer_deform_xy = 1
    outer_quality = 30

    has_pause = true
    pause_radius = 12
    pause_compression = 1.35
    pause_extension = 0.15
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// CIND
// Radius: 571 km
// Tidally locked, with an orbital/rotation period of ~24.1 h.
// Large metal core supports a plausible active dynamo.
// Nominal field assumption: ~0.40 G equatorial
// Dayside magnetopause: ~3.89 Rp
// pause_radius / pause_compression = 6.80 / 1.75 = ~3.89 Rp
// Extreme stellar wind strongly compresses and distorts the magnetosphere.
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Cind

    has_inner = true
    inner_dist = 1.70
    inner_radius = 0.5
    inner_compression = 1.15
    inner_extension = 0.75
    inner_deform = 0.05
    inner_quality = 40

    has_outer = true
    outer_dist = 2.75
    outer_radius = 0.20
    outer_compression = 1.2
    outer_extension = 0.80
    outer_deform = 0.10
    outer_quality = 30

    has_pause = true
    pause_radius = 6.80
    pause_compression = 1.75
    pause_extension = 0.10
    pause_height_scale = 1.40
    pause_deform = 0.15
    pause_quality = 30
}


// ============================================================================
// RadiationBody definitions
// ============================================================================
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Blas
    radiation_model = QP_Blas

    radiation_inner = 6.00
    radiation_inner_gradient = 3.3
    radiation_outer = 1.70
    radiation_outer_gradient = 2.2

    // Modest magnetic shielding from Blas' relatively weak magnetosphere.
    // No intrinsic surface radiation source.
    radiation_pause = -0.007
    radiation_surface = 0
}

// Geet has no independent global magnetosphere.
// Its radiation environment is dominated by Blas and the star.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Geet
    radiation_surface = 0
}

RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Jot
    radiation_model = QP_Jot

    radiation_inner = 120
    radiation_inner_gradient = 3.3
    radiation_outer = 15
    radiation_outer_gradient = 2.2

    // Strong magnetic shielding, appropriate for Jot's powerful dynamo.
    // A 9 rad/h near-planet source represents Jot's broad radiation environment
    // while remaining below the equivalent stock Jool surface contribution.
    radiation_pause = -0.014
    radiation_surface = 9
}

// Subon has no independent global field.
// At ~1.67 Jot radii, its orbit lies naturally inside Jot's inner belt.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Subon
    radiation_surface = 0
}

RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Cind
    radiation_model = QP_Cind

    radiation_inner = 10
    radiation_inner_gradient = 3.3

    // Compact outer belt compared with Jot.
    radiation_outer = 1.5
    radiation_outer_gradient = 2.2

    // Despite Cind's strong intrinsic dynamo, the close stellar environment
    // severely compresses its magnetosphere, limiting the effective shielding.
    // No intrinsic surface radiation source.
    radiation_pause = -0.009
    radiation_surface = 0
}
