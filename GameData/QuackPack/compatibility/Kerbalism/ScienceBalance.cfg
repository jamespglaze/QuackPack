// Subon's stock-scale SOI is about 32.58 km from its centre, only 16.58 km
// above its 16 km reference radius. The original 27 km science threshold is
// outside that SOI. A 13 km threshold leaves both space situations reachable
// above the approximately 10.5 km maximum terrain. Science rewards are unchanged.
// Recheck this threshold if another mod changes the orbit, gravity or scale.
@Kopernicus:AFTER[QuackPack]:NEEDS[QuackPack,Kerbalism,FeatureScience]
{
    @Body[Subon]
    {
        @Properties
        {
            @ScienceValues
            {
                %spaceAltitudeThreshold = 13000
            }
        }
    }
}
