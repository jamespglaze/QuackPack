// Existing experiment IDs; no extra experiment definitions or science multipliers.
// % creates missing result nodes/values without appending duplicate entries.
// General space results must work with Kerbalism's unified Space situation,
// serialized as InSpaceLow. Keep InSpaceHigh/SrfSplashed for other profiles.

@EXPERIMENT_DEFINITION[*]:HAS[#id[geigerCounter]]:NEEDS[QuackPack,Kerbalism,FeatureRadiation]:AFTER[QuackPack]
{
    %RESULTS
    {
        %BlasSrfLanded = #LOC_QP_RAD_SCI_BlasSrfLanded
        %BlasFlyingLow = #LOC_QP_RAD_SCI_BlasFlyingLow
        %BlasFlyingHigh = #LOC_QP_RAD_SCI_BlasFlyingHigh
        %BlasInSpaceLow = #LOC_QP_RAD_SCI_BlasInSpaceLow
        %BlasInSpaceHigh = #LOC_QP_RAD_SCI_BlasInSpaceHigh
        %GeetSrfLanded = #LOC_QP_RAD_SCI_GeetSrfLanded
        %GeetInSpaceLow = #LOC_QP_RAD_SCI_GeetInSpaceLow
        %GeetInSpaceHigh = #LOC_QP_RAD_SCI_GeetInSpaceHigh
        %JotFlyingLow = #LOC_QP_RAD_SCI_JotFlyingLow
        %JotFlyingHigh = #LOC_QP_RAD_SCI_JotFlyingHigh
        %JotInSpaceLow = #LOC_QP_RAD_SCI_JotInSpaceLow
        %JotInSpaceHigh = #LOC_QP_RAD_SCI_JotInSpaceHigh
        %SubonSrfLanded = #LOC_QP_RAD_SCI_SubonSrfLanded
        %SubonInSpaceLow = #LOC_QP_RAD_SCI_SubonInSpaceLow
        %SubonInSpaceHigh = #LOC_QP_RAD_SCI_SubonInSpaceHigh
        %CindSrfLanded = #LOC_QP_RAD_SCI_CindSrfLanded
        %CindSrfSplashed = #LOC_QP_RAD_SCI_CindSrfSplashed
        %CindFlyingLow = #LOC_QP_RAD_SCI_CindFlyingLow
        %CindFlyingHigh = #LOC_QP_RAD_SCI_CindFlyingHigh
        %CindInSpaceLow = #LOC_QP_RAD_SCI_CindInSpaceLow
        %CindInSpaceHigh = #LOC_QP_RAD_SCI_CindInSpaceHigh
    }
}

// Only add virtual-biome results when Kerbalism's science system is active.
// Moons retain general results: inherited fields do not imply local virtual
// biome availability in the reference Kerbalism implementation.
@EXPERIMENT_DEFINITION[*]:HAS[#id[geigerCounter]]:NEEDS[QuackPack,Kerbalism,FeatureRadiation,FeatureScience]:AFTER[QuackPack]
{
    %RESULTS
    {
        %BlasInSpaceLowInnerBelt = #LOC_QP_RAD_SCI_BlasInnerBelt
        %BlasInSpaceHighInnerBelt = #LOC_QP_RAD_SCI_BlasInnerBelt
        %BlasInSpaceLowOuterBelt = #LOC_QP_RAD_SCI_BlasOuterBelt
        %BlasInSpaceHighOuterBelt = #LOC_QP_RAD_SCI_BlasOuterBelt
        %BlasInSpaceLowMagnetosphere = #LOC_QP_RAD_SCI_BlasMagnetosphere
        %BlasInSpaceHighMagnetosphere = #LOC_QP_RAD_SCI_BlasMagnetosphere
        %JotInSpaceLowInnerBelt = #LOC_QP_RAD_SCI_JotInnerBelt
        %JotInSpaceHighInnerBelt = #LOC_QP_RAD_SCI_JotInnerBelt
        %JotInSpaceLowOuterBelt = #LOC_QP_RAD_SCI_JotOuterBelt
        %JotInSpaceHighOuterBelt = #LOC_QP_RAD_SCI_JotOuterBelt
        %JotInSpaceLowMagnetosphere = #LOC_QP_RAD_SCI_JotMagnetosphere
        %JotInSpaceHighMagnetosphere = #LOC_QP_RAD_SCI_JotMagnetosphere
        %CindInSpaceLowInnerBelt = #LOC_QP_RAD_SCI_CindInnerBelt
        %CindInSpaceHighInnerBelt = #LOC_QP_RAD_SCI_CindInnerBelt
        %CindInSpaceLowOuterBelt = #LOC_QP_RAD_SCI_CindOuterBelt
        %CindInSpaceHighOuterBelt = #LOC_QP_RAD_SCI_CindOuterBelt
        %CindInSpaceLowMagnetosphere = #LOC_QP_RAD_SCI_CindMagnetosphere
        %CindInSpaceHighMagnetosphere = #LOC_QP_RAD_SCI_CindMagnetosphere
    }
}
